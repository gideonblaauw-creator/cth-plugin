# TEMPLATE — copy to .github/workflows/visual-ci.yml in the owning Lane A product repo.
# Do not enable org-wide from cth-plugin. See docs/software-factory-ship-ci.md
#
# Mic Prove in CI: Playwright captures screenshots/video; Argos or Lost Pixel posts diffs on the PR.
# Supplements Hands before/after in the PR body — does not replace pytest/smoke.
#
# Secrets (Infisical → GitHub Actions on the product repo; names only):
#   ARGOS_TOKEN — if using Argos CI
#   LOST_PIXEL_API_KEY — if using Lost Pixel instead
#
# Per-product [PENDIENTE]:
#   BASE_URL / PREVIEW_URL — Vercel preview or staging URL for Playwright

name: Visual CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        # Product repo must define package.json + playwright dependency

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright (screenshots + video on failure)
        run: npx playwright test
        env:
          # [PENDIENTE] — plant per product (repo variable, secret, or Vercel preview URL)
          BASE_URL: ${{ vars.PREVIEW_URL || 'http://127.0.0.1:3000' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Option A: Argos CI — comment visual diffs on the PR
      - name: Argos upload
        if: always()
        uses: argos-ci/action@v5
        with:
          token: ${{ secrets.ARGOS_TOKEN }}
        # Requires argos-cli + @argos-ci/playwright in product repo — see Argos docs

      # Option B: Lost Pixel — uncomment and remove Argos step if preferred
      # - name: Lost Pixel
      #   uses: lost-pixel/lost-pixel@v3.18.0
      #   env:
      #     LOST_PIXEL_API_KEY: ${{ secrets.LOST_PIXEL_API_KEY }}
