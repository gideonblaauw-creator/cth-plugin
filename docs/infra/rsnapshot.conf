config_version	1.2
snapshot_root	/mnt/data/backups/claude-files/
cmd_cp	/usr/bin/cp
cmd_rm	/usr/bin/rm
cmd_rsync	/usr/bin/rsync
cmd_logger	/usr/bin/logger
cmd_du	/usr/bin/du

retain	hourly	6
retain	daily	7
retain	weekly	4
retain	monthly	6

verbose	2
loglevel	3
logfile	/var/log/rsnapshot.log
lockfile	/var/run/rsnapshot.pid

backup	/opt/claude-files/	localhost/claude-files/
backup	/opt/files-mcp/logs/	localhost/files-mcp-logs/
#backup	/opt/cth/	localhost/cth-pod/
backup	/opt/bookstack/	localhost/bookstack/
