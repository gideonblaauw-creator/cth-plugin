<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<title>03-datalab carousel 4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Titillium+Web:wght@700&display=swap');

    .layout-carousel {
      background: #B2EEFA;
      height: 100%;
      padding: 48px 44px;
      display: flex;
      align-items: center;
    }
    .carousel-inner { width: 100%; }
    .layout-carousel .head { font-size: 75px; color: #0C498A; line-height: 1.05; }
    .layout-carousel .sub { font-size: 41px; font-weight: 600; margin: 12px 0 20px; color: #0C498A; }
    .layout-carousel .bullet { font-size: 34px; color: #0C498A; }
    .layout-carousel .slide-no { font-size: 18px; color: #669348; font-weight: 600; margin-bottom: 16px; }
    .layout-carousel .tag { margin-top: 24px; font-size: 20px; color: #669348; }
    
html, body { width:1080px; height:1080px; overflow:hidden; margin:0; }
</style></head><body>
    <div class="canvas layout-carousel">
      <div class="carousel-inner">
        <p class="slide-no">4/4</p>
        <h1 class="head">Aliados</h1>
        <p class="sub">Air4U · CleantechHUB · [LOGO EXTERNADO]</p>
        <div class="lines"><p class="bullet">Sede: PENDIENTE</p><p class="bullet">Hora: PENDIENTE</p><p class="bullet">Registro: PENDIENTE</p></div>
        <p class="tag">CleantechHUB · Inspira. Actúa. Transforma.</p>
      </div>
    </div>
    </body></html>
