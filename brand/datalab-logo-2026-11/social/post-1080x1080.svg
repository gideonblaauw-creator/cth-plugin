<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="CTH Data Lab soft launch social square">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@700&amp;family=Open+Sans:wght@400;600&amp;display=swap');
      .head { font-family: 'Titillium Web', sans-serif; font-weight: 700; fill: #FFFFFF; }
      .sub { font-family: 'Open Sans', sans-serif; font-weight: 600; fill: #B2EEFA; }
      .body { font-family: 'Open Sans', sans-serif; font-weight: 400; fill: #FFFFFF; }
      .tag { font-family: 'Open Sans', sans-serif; font-weight: 400; fill: #9DC384; }
      .slot { font-family: 'Open Sans', sans-serif; font-weight: 600; font-size: 11px; fill: #0C498A; }
    </style>
  </defs>
  <rect width="1080" height="1080" fill="#0C498A"/>
  <!-- Option A mark (embedded) -->
  <g transform="translate(80, 100) scale(1.35)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#B2EEFA"/>
    <rect x="28" y="0" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="56" y="0" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="84" y="0" width="22" height="22" rx="4" fill="#69B5FA"/>
    <rect x="0" y="28" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="28" y="28" width="22" height="22" rx="4" fill="#9DC384"/>
    <rect x="56" y="28" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="84" y="28" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="0" y="56" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="28" y="56" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
    <rect x="56" y="56" width="22" height="22" rx="4" fill="#B2EEFA"/>
    <rect x="84" y="56" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.25"/>
  </g>
  <text class="head" font-size="72" x="80" y="320">CTH Data Lab</text>
  <text class="sub" font-size="40" x="80" y="390">Soft launch</text>
  <text class="head" font-size="52" x="80" y="480">Tue 24 Nov 2026</text>
  <text class="body" font-size="28" x="80" y="540">Earth Observatory</text>
  <text class="body" font-size="24" x="80" y="600">Data Lab sandboxes · Data Governance</text>
  <text class="body" font-size="22" x="80" y="660">Time: PENDIENTE · Venue: PENDIENTE</text>
  <text class="tag" font-size="26" x="80" y="740">Inspira. Actúa. Transforma.</text>
  <!-- CTH logo placeholder -->
  <rect x="80" y="820" width="200" height="56" rx="6" fill="#FFFFFF" opacity="0.15" stroke="#B2EEFA" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="sub" font-size="14" x="90" y="854">CTH logo (official asset) PENDIENTE</text>
  <!-- Partner slots -->
  <rect x="80" y="920" width="220" height="64" rx="6" fill="#FFFFFF"/>
  <text class="slot" x="92" y="958">Externado logo PENDIENTE</text>
  <rect x="320" y="920" width="220" height="64" rx="6" fill="#FFFFFF"/>
  <text class="slot" x="332" y="958">Partner logo PENDIENTE</text>
