# Observatorio de la Tierra (Earth Observatory) — co-brand DNA
# Parent: CleantechHUB five-colour system + Universidad Externado lockups
# Style reference: decks/earth-observatory-externado-2026-10 (eo-extra.css) when on main

brand: Observatorio de la Tierra
brand_en: Earth Observatory
partners:
  - Universidad Externado de Colombia
  - CleantechHUB Foundation
tagline: Inspira. Actúa. Transforma.
