  - name: Sky Blue
    hex: "#69B5FA"
    rgb: "105, 181, 250"
    cmyk: "58, 28, 0, 2"
    role: accent

typography:
  web_stack: "'Open Sans', 'PT Sans', system-ui, sans-serif"
  headline: Open Sans
  body: Open Sans
  data: PT Sans

logo:
  cobrand_dir: final/cobrand
