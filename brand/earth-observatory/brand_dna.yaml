# Observatorio de la Tierra (Earth Observatory) — co-brand DNA
# Style basis: Propuesta técnica v3 (Gideon reference, Nov 2026)

brand: Observatorio de la Tierra
brand_en: Earth Observatory
partners:
  - Universidad Externado de Colombia
  - CleantechHUB Foundation
tagline: Observa. Actúa. Transforma.
tagline_en: Observe. Act. Transform.

naming:
  official_es: Observatorio de la Tierra
  datalab: Datalab del Observatorio de la Tierra
  sandboxes:
    - Open Energy Sandbox
    - Open Air Sandbox
    - Open Water Sandbox

colors:
  - name: Blue Mid (cover)
    hex: "#0058A3"
    role: primary gradient
  - name: Blue Deep (cover)
    hex: "#061D3B"
    role: primary gradient
  - name: Blue Title
    hex: "#1E4E79"
    role: headings, table headers
  - name: Green Section
    hex: "#79965F"
    role: section numbers, subheads
  - name: Green Tagline
    hex: "#8DC63F"
    role: Observa. Actúa. Transforma.
  - name: Row Alt
    hex: "#EBF1F7"
    role: table stripes
  - name: Callout
    hex: "#E3F2FD"
    role: emphasis boxes

typography:
  web_stack: "'Titillium Web', 'Open Sans', system-ui, sans-serif"
  headline: Titillium Web
  body: Open Sans

logo:
  cobrand_dir: final/cobrand
  es_dir: final/es
  manifest: final/MANIFEST.json
  clear_space: "1× altura del bloque Externado en todos los lados"
  min_width_screen_px: 120
  min_width_print_mm: 25

manual_version: v3
rejects:
  - Tierra natural (v2 gradients / sand palette)
