<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8e8e8;font-family:'Open Sans',sans-serif}
.row{display:flex;gap:40px;padding:0}
.art{position:relative;overflow:hidden;color:#0C498A;background:#FAFAF8}
.ig{width:1080px;height:1080px;padding:88px 80px;display:flex;flex-direction:column;justify-content:space-between}
.rule{width:120px;height:3px;background:#669348;margin:28px 0 36px}
.display{font-family:'Source Serif 4',serif;font-size:52px;line-height:1.12;font-weight:700;max-width:880px}
.logo{height:78px;width:auto}
.kicker{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#669348}
.banner{width:1584px;height:396px;padding:36px 48px;display:flex;align-items:center;justify-content:space-between;gap:48px}
.banner .display{font-size:34px;max-width:720px}
.banner .logo{height:44px}
.banner .rule{width:80px;margin:16px 0 20px}
</style></head><body>
<div class="row">
  <div class="art ig">
    <div>
      <img class="logo" src="../final/cobrand/eo-cobrand-blue-transparent.png" alt="Observatorio de la Tierra"/>
      <div class="rule"></div>
      <p class="kicker">Dirección 1 · Editorial blanco</p>
    </div>
    <p class="display">Datos abiertos para el territorio colombiano</p>
  </div>
  <div class="art banner">
    <div>
      <img class="logo" src="../final/cobrand/eo-cobrand-blue-transparent.png" alt=""/>
      <div class="rule"></div>
      <p class="kicker">LinkedIn banner</p>
    </div>
    <p class="display">Datos abiertos para el territorio colombiano</p>
  </div>
</div>
</body></html>
