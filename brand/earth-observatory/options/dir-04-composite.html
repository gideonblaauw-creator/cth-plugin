<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8e8e8;font-family:'Open Sans',sans-serif}
.row{display:flex;gap:40px}
.art{position:relative;overflow:hidden;background:#0A1628;color:#E8EDF2}
.grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(178,238,250,.08) 1px,transparent 1px),
  linear-gradient(90deg,rgba(178,238,250,.08) 1px,transparent 1px);
  background-size:24px 24px}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,#669348 1.5px,transparent 1.5px);
  background-size:48px 48px;background-position:12px 12px;opacity:.45}
.ig{width:1080px;height:1080px;padding:72px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1}
.display{font-family:'Space Grotesk',sans-serif;font-size:46px;line-height:1.08;font-weight:700;color:#fff}
.logo{height:76px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#B2EEFA;margin-top:20px}
.chip{display:inline-block;padding:6px 12px;border:1px solid rgba(102,147,72,.6);color:#9DC384;font-size:11px;font-weight:700;letter-spacing:.08em;margin-top:12px}
.banner{width:1584px;height:396px;padding:36px 48px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.banner .display{font-size:28px;max-width:640px}
.banner .logo{height:40px}
</style></head><body>
<div class="row">
  <div class="art ig"><div class="grid"></div><div class="dots"></div>
    <div><img class="logo" src="../final/cobrand/eo-cobrand-reverse-transparent.png" alt=""/><p class="kicker">Dirección 4 · Datos / grid</p><span class="chip">EO · Datalab</span></div>
    <p class="display">Datos abiertos para el territorio colombiano</p>
  </div>
  <div class="art banner"><div class="grid"></div><div class="dots"></div>
    <img class="logo" src="../final/cobrand/eo-cobrand-reverse-transparent.png" alt=""/>
    <p class="display">Datos abiertos para el territorio colombiano</p>
  </div>
</div>
</body></html>
