<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#f0f0f0;padding:40px;color:#0C498A}
h1{font-size:28px;margin-bottom:8px}
.sub{font-size:14px;color:#555;margin-bottom:32px;max-width:900px}
.stack{display:flex;flex-direction:column;gap:28px}
.row{display:flex;align-items:center;gap:20px}
.label{width:200px;font-weight:700;font-size:14px}
img{width:2464px;height:auto;max-width:calc(100vw - 280px);border:1px solid #ccc;box-shadow:0 2px 8px rgba(0,0,0,.08)}
</style></head><body>
<h1>Observatorio de la Tierra — cinco direcciones visuales</h1>
<p class="sub">Sin gradientes a sangre. Copy: «Datos abiertos para el territorio colombiano». Instagram 1080×1080 + banner LinkedIn 1584×396 por dirección.</p>
<div class="stack">
  <div class="row"><span class="label">1 Editorial blanco</span><img src="eo-dir-1.png" alt=""/></div>
  <div class="row"><span class="label">2 Cartográfico</span><img src="eo-dir-2.png" alt=""/></div>
  <div class="row"><span class="label">3 Tierra natural</span><img src="eo-dir-3.png" alt=""/></div>
  <div class="row"><span class="label">4 Datos / grid</span><img src="eo-dir-4.png" alt=""/></div>
  <div class="row"><span class="label">5 Foto + bloque</span><img src="eo-dir-5.png" alt=""/></div>
</div>
</body></html>
