<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Open+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#D4C4A8}
.frame{width:1584px;height:396px;display:flex;overflow:hidden}
.side{width:28%;height:100%;background:#6B7B4C;flex-shrink:0}
.main{flex:1;background:#A67C52;padding:36px 48px;display:flex;align-items:center;justify-content:space-between;gap:32px;color:#fff}
.logo{height:40px;width:auto}
.tag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#D4C4A8;margin-top:12px}
.title{font-family:'Lora',serif;font-size:30px;font-weight:700;line-height:1.12;max-width:620px;color:#fff}
.meta{font-size:9px;font-weight:600;color:rgba(255,255,255,.85);margin-top:8px}
.zone{position:absolute;border:2px dashed rgba(212,196,168,.55);border-radius:8px;pointer-events:none;inset:24px}
.wrap{position:relative}
</style></head><body>
<div class="wrap">
<div class="frame" role="img" aria-label="Banner evento 1584×396">
  <div class="side" aria-hidden="true"></div>
  <div class="main">
    <div>
      <img class="logo" src="../../final/cobrand/eo-cobrand-reverse-transparent.png" alt="Observatorio de la Tierra"/>
      <p class="tag">Banner evento</p>
    </div>
    <div>
      <p class="title">Datos abiertos para el territorio colombiano</p>
      <p class="meta">Zona segura · 1584×396 · Observatorio de la Tierra</p>
    </div>
  </div>
</div>
<div class="zone" aria-hidden="true"></div>
</div>
</body></html>
