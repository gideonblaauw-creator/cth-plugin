<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><style>

@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#0C498A}
.frame{width:1280px;height:720px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0C498A 0%,#669348 55%,#69B5FA 100%);color:#fff}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(178,238,250,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(178,238,250,.12) 1px,transparent 1px);background-size:32px 32px;opacity:.6}
.safe{position:absolute;inset:43px;display:flex;flex-direction:column;justify-content:space-between}
.logo{height:57px;width:auto}
.tag{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B2EEFA}
.title{font-size:32px;font-weight:800;line-height:1.1;max-width:92%}
.meta{font-size:10px;font-weight:600;color:#B2EEFA}
.zone{position:absolute;border:2px dashed rgba(178,238,250,.45);border-radius:8px;pointer-events:none}

</style></head><body>
<div class="frame" role="img" aria-label="YouTube miniatura 1280×720">
  <div class="grid" aria-hidden="true"></div>
  <div class="zone" style="inset:43px" aria-hidden="true"></div>
  <div class="safe">
    <div>
      <img class="logo" src="../../final/cobrand/eo-cobrand-reverse-transparent.png" alt="Observatorio de la Tierra"/>
      <p class="tag" style="margin-top:21px">YouTube miniatura</p>
    </div>
    <div>
      <p class="title">Datos abiertos para el territorio colombiano</p>
      <p class="meta" style="margin-top:8px">Zona segura · 1280×720 · Observatorio de la Tierra</p>
    </div>
  </div>
</div>
</body></html>
