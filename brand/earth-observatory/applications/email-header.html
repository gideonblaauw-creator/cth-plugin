<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <style>
    body { margin: 0; }
    .banner {
      width: 600px;
      height: 200px;
      background: linear-gradient(120deg, #0C498A, #669348 60%, #69B5FA);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      box-sizing: border-box;
      font-family: 'Open Sans', Arial, sans-serif;
      color: #fff;
    }
    img { height: 56px; width: auto; }
    .tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #B2EEFA; font-weight: 700; }
    h1 { margin: 6px 0 0; font-size: 22px; line-height: 1.2; }
  </style>
</head>
<body>
  <div class="banner" role="img" aria-label="Encabezado correo Observatorio de la Tierra">
    <div>
      <p class="tag">Observatorio de la Tierra</p>
      <h1>Datalab · datos para el territorio</h1>
    </div>
    <img src="../final/cobrand/eo-cobrand-reverse-transparent.png" alt="Co-brand EO"/>
  </div>
</body>
</html>
