<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="EXAMPLE DATA chart">
  <defs>
    <style>
      @font-face {
        font-family: "Titillium Web";
        font-weight: 700;
        src: url("../fonts/TitilliumWeb-Bold.ttf") format("truetype");
      }
      @font-face {
        font-family: "Open Sans";
        font-weight: 400;
        src: url("../fonts/OpenSans-Regular.ttf") format("truetype");
      }
      .t { font-family: "Titillium Web", sans-serif; font-weight: 700; fill: #0C498A; }
      .b { font-family: "Open Sans", sans-serif; fill: #0C498A; }
    </style>
  </defs>
  <rect width="640" height="360" fill="#FFFFFF"/>
  <text x="20" y="32" class="t" font-size="18">EXAMPLE DATA · categorical palette</text>
  <rect x="60" y="160" width="80" height="120" fill="#0C498A"/>
  <rect x="160" y="100" width="80" height="180" fill="#669348"/>
  <rect x="260" y="190" width="80" height="90" fill="#69B5FA"/>
  <rect x="360" y="130" width="80" height="150" fill="#9DC384"/>
  <rect x="460" y="220" width="80" height="60" fill="#B2EEFA"/>
  <line x1="40" y1="280" x2="580" y2="280" stroke="#0C498A" stroke-width="2"/>
  <text x="100" y="300" text-anchor="middle" class="b" font-size="12">A</text>
  <text x="200" y="300" text-anchor="middle" class="b" font-size="12">B</text>
  <text x="300" y="300" text-anchor="middle" class="b" font-size="12">C</text>
  <text x="400" y="300" text-anchor="middle" class="b" font-size="12">D</text>
  <text x="500" y="300" text-anchor="middle" class="b" font-size="12">E</text>
  <rect x="420" y="40" width="200" height="100" rx="6" fill="#B2EEFA" stroke="#0C498A"/>
  <text x="520" y="70" text-anchor="middle" class="b" font-size="11">Map fill · Deep Blue</text>
  <text x="520" y="92" text-anchor="middle" class="b" font-size="11">Highlights · Sky / Forest</text>
  <text x="520" y="114" text-anchor="middle" class="b" font-size="11">EXAMPLE DATA only</text>
</svg>
