<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleantechHUB · OVH edge architecture (smoke)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #B2EEFA;
      --color-ink:     #0C498A;
      --color-muted:   #669348;
      --color-accent:  #9DC384;
      --color-link:    #69B5FA;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CleantechHUB · diagram-design smoke</p>
    <h1>Public web properties on the OVH VPS</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cth-smoke-title cth-smoke-desc">
      <title id="cth-smoke-title">CleantechHUB OVH VPS architecture</title>
      <desc id="cth-smoke-desc">HTTPS traffic from browsers reaches Caddy on the OVH VPS, which routes to WordPress, BookStack, and static Nexus HTML.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#669348"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9DC384"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#69B5FA"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#B2EEFA"/>

      <!-- Zone: Docker services -->
      <rect x="360" y="120" width="580" height="320" rx="8" fill="rgba(12,73,138,0.04)" stroke="rgba(12,73,138,0.14)" stroke-width="0.8"/>
      <rect x="416" y="124" width="120" height="12" rx="2" fill="#B2EEFA"/>
      <text x="476" y="133" fill="#4A7A9B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OVH VPS · DOCKER</text>

      <!-- Arrows (behind nodes) -->
      <line x1="168" y1="280" x2="220" y2="280" stroke="#69B5FA" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="364" y1="280" x2="416" y2="280" stroke="#9DC384" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M 520,248 H 600 Q 608,248 608,240 V 200" fill="none" stroke="#669348" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 520,312 H 600 Q 608,312 608,320 V 360" fill="none" stroke="#669348" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 520,280 H 720" fill="none" stroke="#669348" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="172" y="260" width="48" height="12" rx="2" fill="#B2EEFA"/>
      <text x="196" y="270" fill="#69B5FA" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="368" y="260" width="40" height="12" rx="2" fill="#B2EEFA"/>
      <text x="388" y="270" fill="#9DC384" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TLS</text>

      <!-- Visitor -->
      <rect x="40" y="248" width="128" height="64" rx="6" fill="#B2EEFA"/>
      <rect x="40" y="248" width="128" height="64" rx="6" fill="rgba(102,147,72,0.12)" stroke="#4A7A9B" stroke-width="1"/>
      <text x="104" y="284" fill="#0C498A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Visitor</text>
      <text x="104" y="300" fill="#669348" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser</text>

      <!-- Caddy focal -->
      <rect x="220" y="248" width="144" height="64" rx="6" fill="#B2EEFA"/>
      <rect x="220" y="248" width="144" height="64" rx="6" fill="rgba(157,195,132,0.18)" stroke="#9DC384" stroke-width="1.2"/>
      <rect x="228" y="256" width="36" height="12" rx="2" fill="transparent" stroke="rgba(157,195,132,0.55)" stroke-width="0.8"/>
      <text x="246" y="265" fill="#669348" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="292" y="284" fill="#0C498A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Caddy</text>
      <text x="292" y="300" fill="#669348" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Reverse proxy</text>

      <!-- Router hub -->
      <rect x="416" y="248" width="104" height="64" rx="6" fill="#FFFFFF" stroke="#0C498A" stroke-width="1"/>
      <text x="468" y="284" fill="#0C498A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route</text>
      <text x="468" y="300" fill="#669348" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Host match</text>

      <!-- WordPress -->
      <rect x="560" y="168" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#0C498A" stroke-width="1"/>
      <text x="640" y="204" fill="#0C498A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WordPress</text>
      <text x="640" y="220" fill="#669348" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cleantechhub.net</text>

      <!-- BookStack -->
      <rect x="560" y="328" width="160" height="64" rx="6" fill="rgba(12,73,138,0.06)" stroke="#669348" stroke-width="1"/>
      <text x="640" y="364" fill="#0C498A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BookStack</text>
      <text x="640" y="380" fill="#669348" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wiki.cleantechhub.net</text>

      <!-- Nexus static -->
      <rect x="760" y="248" width="160" height="64" rx="6" fill="#0C498A" stroke="#0C498A" stroke-width="1"/>
      <text x="840" y="276" fill="#FFFFFF" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nexus static</text>
      <text x="840" y="292" fill="#B2EEFA" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nexus.cleantechhub.net</text>

      <!-- Legend -->
      <line x1="40" y1="468" x2="960" y2="468" stroke="rgba(12,73,138,0.12)" stroke-width="0.8"/>
      <text x="40" y="488" fill="#669348" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="476" width="12" height="12" rx="2" fill="rgba(157,195,132,0.18)" stroke="#9DC384"/>
      <text x="140" y="486" fill="#0C498A" font-size="9" font-family="'Geist', sans-serif">Focal edge (Caddy)</text>
      <rect x="320" y="476" width="12" height="12" rx="2" fill="#0C498A"/>
      <text x="340" y="486" fill="#0C498A" font-size="9" font-family="'Geist', sans-serif">Deep panel</text>
      <line x1="480" y1="482" x2="508" y2="482" stroke="#69B5FA" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="516" y="486" fill="#0C498A" font-size="9" font-family="'Geist', sans-serif">External HTTPS</text>
    </svg>
  </div>
</body>
</html>
