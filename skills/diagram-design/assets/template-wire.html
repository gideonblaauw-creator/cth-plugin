<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wire diagram shell</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #B2EEFA;
      --color-ink: #0C498A;
      --color-muted: #669348;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    /* @font-face blocks are injected by scripts/render_wire.py — local ./fonts/wire only */
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      padding: 2rem;
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 2vw + 0.5rem, 1.85rem);
      font-weight: 400;
      margin-bottom: 1.25rem;
    }
    .diagram svg { max-width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Wire · CleantechHUB</p>
    <h1>[Wire title]</h1>
    <div class="diagram" id="[wire-id]-wire">
      <!-- Renderer replaces this SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="[wire-id]-title [wire-id]-desc">
        <title id="[wire-id]-title">[Wire title]</title>
        <desc id="[wire-id]-desc">[One sentence describing the wire]</desc>
        <rect width="100%" height="100%" fill="#B2EEFA"/>
      </svg>
    </div>
  </div>
</body>
</html>
