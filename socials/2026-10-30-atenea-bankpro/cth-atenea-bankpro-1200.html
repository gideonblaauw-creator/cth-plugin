<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>BankPro de Atenea — CleantechHUB</title>
  <style>
    :root {
      --cth-primary: #2D6A4F;
      --cth-dark: #1B4332;
      --cth-accent: #95D5B2;
      --cth-light: #D8F3DC;
      --cth-white: #FFFFFF;
      --cth-text: #333333;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background: var(--cth-light);
      color: var(--cth-dark);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 1200px;
      height: 1200px;
      display: flex;
      flex-direction: column;
      background: var(--cth-light);
    }

    .topbar {
      height: 16px;
      background: var(--cth-primary);
      flex: none;
    }

    .main {
      flex: 1;
      padding: 80px 96px 56px;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .brand img {
      width: 128px;
      height: 122px;
      object-fit: contain;
      flex: none;
    }

    .wordmark {
      font-size: 42px;
      line-height: 1;
      letter-spacing: -0.025em;
      color: var(--cth-dark);
    }

    .wordmark .clean { font-weight: 400; }
    .wordmark .hub { font-weight: 700; }

    .headline {
      margin-top: auto;
      margin-bottom: auto;
      max-width: 980px;
    }

    .rule {
      width: 112px;
      height: 10px;
      background: var(--cth-accent);
      border-radius: 5px;
      margin-bottom: 36px;
    }

    .q {
      font-weight: 700;
      font-size: 64px;
      line-height: 1.16;
      letter-spacing: -0.03em;
      color: var(--cth-dark);
    }

    .a {
      margin-top: 36px;
      font-weight: 700;
      font-size: 46px;
      line-height: 1.22;
      letter-spacing: -0.025em;
      color: var(--cth-primary);
    }

    .credit {
      flex: none;
      background: var(--cth-dark);
      color: var(--cth-white);
      padding: 40px 96px 48px;
      font-weight: 500;
      font-size: 28px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="topbar" aria-hidden="true"></div>
    <div class="main">
      <header class="brand">
        <img src="cth-globe-logo.svg" alt="CleantechHUB" width="128" height="122">
        <p class="wordmark"><span class="clean">Cleantech</span><span class="hub">HUB</span></p>
      </header>
      <div class="headline">
        <div class="rule" aria-hidden="true"></div>
        <p class="q">¿Tienes una idea<br>de ciencia o tecnología?</p>
        <p class="a">BankPro de Atenea te ayuda<br>a llegar al financiamiento</p>
      </div>
    </div>
    <footer class="credit">Programa BankPro · Agencia Atenea (Bogotá)</footer>
  </article>
</body>
</html>
